[tools]
actionlint = "1.7.12"
node = "20.19.2"
pnpm = "10.17.1"
rust = { version = "1.97", components = "rustfmt,clippy" }
shellcheck = "0.11.0"

[tasks."git:main"]
description = "Fetch the latest origin/main and point at it via detached HEAD"
shell = "bash -c"
run = """
set -euo pipefail
git fetch origin main
git checkout --detach origin/main
"""

[tasks.fmt]
description = "Format the whole repository"
shell = "bash -c"
run = "cargo fmt --all"

[tasks.app]
description = "Run the desktop app (debug build; fast to compile, slow at runtime)"
shell = "bash -c"
run = """
set -euo pipefail
pnpm install --frozen-lockfile
pnpm tauri dev
"""

[tasks."app:release"]
description = "Run the desktop app with an optimised Rust build (use this for any timing measurement)"
shell = "bash -c"
run = """
set -euo pipefail
pnpm install --frozen-lockfile
pnpm tauri dev --release
"""

[tasks.ci]
description = "Run the same checks CI runs, locally"
shell = "bash -c"
run = """
set -euo pipefail
pnpm install --frozen-lockfile
pnpm exec tsc --noEmit -p crates/app/ui/tsconfig.json
cargo fmt --all -- --check
cargo clippy --all-targets -- -D warnings
cargo test
shellcheck -x .claude/skills/*/scripts/*.sh tools/git/*.sh
actionlint
bash .claude/skills/merge/scripts/check-merge-approval.test.sh
"""
