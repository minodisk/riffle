[tools]
actionlint = "1.7.12"
lychee = "0.24.2"
node = "24.21.0"
pnpm = "10.17.1"
rust = { version = "1.97", components = "rustfmt,clippy" }
shellcheck = "0.11.0"

[tasks."git:main"]
description = "Fetch origin/main, fast-forward local main unless another worktree holds it, and detach HEAD at origin/main"
shell = "bash -c"
run = """
set -euo pipefail
git fetch origin main
if [ "$(git rev-parse --abbrev-ref HEAD)" = main ]; then
  git checkout -q --detach
fi
notice="Notice: local main was not moved (checked out in another worktree or not a fast-forward)"
if git worktree list --porcelain | grep -qx 'branch refs/heads/main'; then
  echo "$notice" >&2
else
  git fetch origin main:main || echo "$notice" >&2
fi
git checkout --detach origin/main
"""

[tasks.fmt]
description = "Format the whole repository"
shell = "bash -c"
run = """
set -euo pipefail
cargo fmt --all
pnpm exec vp fmt
"""

[tasks."tauri:dev"]
description = "Run the desktop app (debug build; fast to compile, slow at runtime)"
shell = "bash -c"
run = """
set -euo pipefail
pnpm install --frozen-lockfile
pnpm tauri dev
"""

[tasks."tauri:release:devtools"]
description = "Run the desktop app with an optimized Rust build (use this for any timing measurement)"
shell = "bash -c"
run = """
set -euo pipefail
pnpm install --frozen-lockfile
pnpm tauri dev --release --features devtools
"""

[tasks."tauri:release"]
description = "Bundle the desktop app as CI does, minus the updater artifacts that need the signing key"
shell = "bash -c"
run = """
set -euo pipefail
pnpm install --frozen-lockfile
pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
"""

[tasks.lint]
description = "Run the OS-independent checks"
shell = "bash -c"
run = """
set -euo pipefail
pnpm install --frozen-lockfile
pnpm exec vp check
cargo fmt --all -- --check
shellcheck -x .claude/skills/*/scripts/*.sh tools/git/*.sh
actionlint
lychee --offline --include-fragments --no-progress --exclude-path 'docs.plans.review-history' '*.md' 'docs/**/*.md' '.claude/**/*.md'
bash .claude/skills/merge/scripts/check-merge-approval.test.sh
bash .claude/skills/merge/scripts/wait-post-merge-runs.test.sh
"""

[tasks.test]
description = "Build and test the workspace, per platform"
shell = "bash -c"
run = """
set -euo pipefail
pnpm install --frozen-lockfile
# Invoke vp's node entry point directly rather than through `pnpm exec`:
# on Windows the mise task shell is bash, and `pnpm exec vp` resolves to
# the `.cmd` shim, which fails to find `node` because it runs under
# cmd.exe with bash's POSIX-style PATH.
node ./node_modules/vite-plus/bin/vp test
cargo clippy --all-targets -- -D warnings
cargo test
"""

[tasks.ci]
description = "Run the same checks CI runs, locally"
shell = "bash -c"
run = """
set -euo pipefail
mise run lint
mise run test
"""
