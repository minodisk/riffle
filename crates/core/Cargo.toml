[package]
name = "riffle-core"
version = "0.4.1"
edition = "2021"

[dependencies]
mozjpeg = "0.10"
mozjpeg-sys = "2.2"
anyhow = "1"
rayon = "1"
quick-xml = "0.42"
tract-onnx = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
natord = "1"
chrono = "0.4"
tempfile = "3"

[dev-dependencies]
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
