[package]
name = "riffle-app"
version = "0.3.1"
edition = "2021"

[features]
# Tauri only enables the webview's devtools automatically in a debug build, so
# an optimized build needs this to opt back in. `mise run tauri:release:devtools` passes
# it; a distributable build leaves it off.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
riffle-core = { path = "../core" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
log = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
notify = "8.2.0"
trash = "5.2.9"
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server"] }
tokio-util = "0.7"
base64 = "0.22"
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time"] }

[dev-dependencies]
mozjpeg = "0.10"
tower = { version = "0.5", features = ["util"] }
