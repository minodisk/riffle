[package]
name = "riffle-app"
version = "0.1.0"
edition = "2021"

[features]
# Tauri only enables the webview's devtools automatically in a debug build, so
# an optimised build needs this to opt back in. `mise run app:release` passes
# it; a distributable build leaves it off.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
riffle-core = { path = "../core" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
mozjpeg = "0.10"
