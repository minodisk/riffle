[package]
name = "riffle-app"
version = "0.1.0"
edition = "2021"

[features]
# Tauri only enables the webview's devtools automatically in a debug build, so
# an optimised build needs this to opt back in. `mise run tauri:release:devtools` passes
# it; a distributable build leaves it off.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
riffle-core = { path = "../core" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
log = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
mozjpeg = "0.10"
