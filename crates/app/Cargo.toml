[package]
name = "riffle-app"
version = "2.0.0"
edition = "2021"

[features]
# Tauri only enables the webview's devtools automatically in a debug build, so
# an optimized build needs this to opt back in. `mise run tauri:release:devtools` passes
# it; a distributable build leaves it off.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
riffle-core = { path = "../core" }
riffle-backend = { path = "../backend" }
chrono = "0.4"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
log = "0.4"
tauri-plugin-dialog = "2"
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6", "gtk3"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[dev-dependencies]
mozjpeg = "0.10"
