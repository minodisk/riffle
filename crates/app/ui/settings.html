<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <h2>Sidecar</h2>
    <label><input type="radio" name="sidecar-format" value="xmp" /> XMP (.xmp)</label>
    <label><input type="radio" name="sidecar-format" value="dop" /> DxO PhotoLab (.dop)</label>
    <h2>Culling</h2>
    <label
      ><input id="auto-advance" type="checkbox" /> Auto-advance after a star, reject or pick</label
    >
    <h2>Keyboard Shortcuts</h2>
    <table id="shortcuts-rows"></table>
    <div class="actions">
      <button id="shortcuts-reset-all" type="button">Reset all</button>
    </div>
    <section id="debug" hidden>
      <h2>Debug</h2>
      <label><input id="debug-timing" type="checkbox" /> Timing logs</label>
    </section>
    <div id="status"></div>
    <script type="module" src="./src/settings.ts"></script>
  </body>
</html>
