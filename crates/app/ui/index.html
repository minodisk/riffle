<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Riffle</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="main">
      <div id="side">
        <button id="open" type="button">Open folder</button>
      </div>
      <div id="viewer">
        <canvas id="canvas"></canvas>
        <div id="empty" hidden></div>
      </div>
      <div id="info">
        <div id="meta"></div>
        <div id="meta-status"></div>
      </div>
    </div>
    <div id="film">
      <div id="strip-bar">
        <div id="position"></div>
        <div id="tools">
          <div id="filter">
            <button
              id="filter-toggle"
              type="button"
              title="Filter"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <path
                  d="M2 3h12l-4.5 5.5V13l-3-1.5v-3z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="caret">&#x25BE;</span>
            </button>
            <div id="filter-menu" role="menu" hidden>
              <button type="button" role="menuitem" id="filter-reset">Reset</button>
              <hr />
              <button type="button" role="menuitemcheckbox" aria-checked="false" data-flag="picked">
                <i class="dot"></i>Picked
              </button>
              <button
                type="button"
                role="menuitemcheckbox"
                aria-checked="false"
                data-flag="untagged"
              >
                <i class="dot"></i>Untagged
              </button>
              <button
                type="button"
                role="menuitemcheckbox"
                aria-checked="false"
                data-flag="rejected"
              >
                <i class="dot"></i>Rejected
              </button>
              <hr />
              <button type="button" role="menuitemcheckbox" aria-checked="false" data-stars="0">
                <span class="on"></span><span class="off">★★★★★</span>
              </button>
              <button type="button" role="menuitemcheckbox" aria-checked="false" data-stars="1">
                <span class="on">★</span><span class="off">★★★★</span>
              </button>
              <button type="button" role="menuitemcheckbox" aria-checked="false" data-stars="2">
                <span class="on">★★</span><span class="off">★★★</span>
              </button>
              <button type="button" role="menuitemcheckbox" aria-checked="false" data-stars="3">
                <span class="on">★★★</span><span class="off">★★</span>
              </button>
              <button type="button" role="menuitemcheckbox" aria-checked="false" data-stars="4">
                <span class="on">★★★★</span><span class="off">★</span>
              </button>
              <button type="button" role="menuitemcheckbox" aria-checked="false" data-stars="5">
                <span class="on">★★★★★</span><span class="off"></span>
              </button>
              <hr />
              <button type="button" role="menuitemcheckbox" aria-checked="false" data-label="red">
                <i class="dot"></i>Red
              </button>
              <button
                type="button"
                role="menuitemcheckbox"
                aria-checked="false"
                data-label="orange"
              >
                <i class="dot"></i>Orange
              </button>
              <button
                type="button"
                role="menuitemcheckbox"
                aria-checked="false"
                data-label="yellow"
              >
                <i class="dot"></i>Yellow
              </button>
              <button type="button" role="menuitemcheckbox" aria-checked="false" data-label="green">
                <i class="dot"></i>Green
              </button>
              <button type="button" role="menuitemcheckbox" aria-checked="false" data-label="blue">
                <i class="dot"></i>Blue
              </button>
              <button type="button" role="menuitemcheckbox" aria-checked="false" data-label="pink">
                <i class="dot"></i>Pink
              </button>
              <button
                type="button"
                role="menuitemcheckbox"
                aria-checked="false"
                data-label="purple"
              >
                <i class="dot"></i>Purple
              </button>
              <button type="button" role="menuitemcheckbox" aria-checked="false" data-label="none">
                <i class="dot"></i>No label
              </button>
              <hr />
              <button
                type="button"
                role="menuitemcheckbox"
                aria-checked="false"
                data-orientation="portrait"
              >
                Portrait
              </button>
              <button
                type="button"
                role="menuitemcheckbox"
                aria-checked="false"
                data-orientation="landscape"
              >
                Landscape
              </button>
              <div id="filter-exif"></div>
            </div>
          </div>
          <div id="sort">
            <button
              id="sort-toggle"
              type="button"
              title="Sort"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <path
                  d="M5 2v12M2 11l3 3 3-3M11 14V2M8 5l3-3 3 3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="caret">&#x25BE;</span>
            </button>
            <div id="sort-menu" role="menu" hidden>
              <button type="button" role="menuitemradio" aria-checked="false" data-sort="capture">
                Capture time
              </button>
              <button type="button" role="menuitemradio" aria-checked="true" data-sort="name">
                File name
              </button>
              <button type="button" role="menuitemradio" aria-checked="false" data-sort="rating">
                Rating
              </button>
            </div>
          </div>
        </div>
      </div>
      <div id="strip"><div id="strip-inner"></div></div>
    </div>
    <div id="context-menu" role="menu" hidden></div>
    <div id="format-dialog" role="dialog" aria-modal="true" aria-labelledby="format-title" hidden>
      <div id="format-box">
        <p id="format-title">Which software do you develop your photos in?</p>
        <p>Riffle writes your ratings, picks and labels to the sidecar files it reads.</p>
        <div id="format-choices">
          <button type="button" data-format="xmp">Lightroom (XMP)</button>
          <button type="button" data-format="dop">DxO PhotoLab (.dop)</button>
          <button type="button" data-format="both">Both</button>
        </div>
        <p class="note">You can change this later in Settings.</p>
        <p id="format-error" hidden></p>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
