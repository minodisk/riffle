<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Riffle</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="update" hidden>
      <span id="update-text"></span>
      <button id="update-install" type="button">Install</button>
    </div>
    <div id="shortcuts" hidden>
      <table id="shortcuts-rows"></table>
      <div id="shortcuts-status"></div>
      <div class="actions">
        <button id="shortcuts-reset-all" type="button">Reset all</button>
        <button id="shortcuts-close" type="button">Close</button>
      </div>
    </div>
    <div id="main">
      <div id="side">
        <div id="filter">
          <button id="filter-toggle" type="button" title="Filter" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 3h12l-4.5 5.5V13l-3-1.5v-3z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            <span class="caret">&#x25BE;</span>
          </button>
          <div id="filter-menu" role="menu" hidden>
            <button type="button" role="menuitem" id="filter-reset">Reset</button>
            <hr />
            <button type="button" role="menuitemcheckbox" aria-checked="false" data-flag="picked"><i class="dot"></i>Picked</button>
            <button type="button" role="menuitemcheckbox" aria-checked="false" data-flag="untagged"><i class="dot"></i>Untagged</button>
            <button type="button" role="menuitemcheckbox" aria-checked="false" data-flag="rejected"><i class="dot"></i>Rejected</button>
            <hr />
            <button type="button" role="menuitemcheckbox" aria-checked="false" data-stars="0"><span class="on"></span><span class="off">★★★★★</span></button>
            <button type="button" role="menuitemcheckbox" aria-checked="false" data-stars="1"><span class="on">★</span><span class="off">★★★★</span></button>
            <button type="button" role="menuitemcheckbox" aria-checked="false" data-stars="2"><span class="on">★★</span><span class="off">★★★</span></button>
            <button type="button" role="menuitemcheckbox" aria-checked="false" data-stars="3"><span class="on">★★★</span><span class="off">★★</span></button>
            <button type="button" role="menuitemcheckbox" aria-checked="false" data-stars="4"><span class="on">★★★★</span><span class="off">★</span></button>
            <button type="button" role="menuitemcheckbox" aria-checked="false" data-stars="5"><span class="on">★★★★★</span><span class="off"></span></button>
          </div>
        </div>
        <div id="strip"><div id="strip-inner"></div></div>
        <div id="position"></div>
        <button id="open" type="button">Open folder</button>
      </div>
      <canvas id="canvas"></canvas>
      <div id="meta"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
