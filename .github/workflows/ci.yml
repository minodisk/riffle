name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on a PR, but never on main: merger waits for the run
# tied to the merge commit, and cancelling it there would leave nothing to wait
# for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The checks that cannot differ between platforms — formatting, the UI types,
  # the workflow and shell linters. Running them once keeps the matrix below to
  # what it is actually there for.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Resolve the toolchain from mise.toml so CI and local use the same
      # compiler. A drifting version shows up as clippy lints that fail only
      # here.
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.0

      # pnpm's store lives in a different place per OS, so ask pnpm rather than
      # hard-coding a path that would silently cache nothing.
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Run the lints
        run: mise run lint

  # Riffle ships on all three desktop platforms, so the build and the tests run
  # on all three. fail-fast stays off: when something is platform-specific we
  # want to see every platform's verdict in one run, not just the first to fail.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Tauri links against the system WebView, which on Linux means webkit2gtk
      # and its companions. Without these the app crate does not even compile,
      # so this has to come before the toolchain does any building.
      - name: Install the Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build and test
        run: mise run test

  # Branch protection requires a single check named `ci`. This job stands in for
  # the whole run, so the lint job and the matrix can change shape without the
  # required check going missing. always() makes it report a failure rather
  # than being skipped when something it needs fails.
  ci:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        run: |
          [ "${{ needs.lint.result }}" = success ]
          [ "${{ needs.test.result }}" = success ]
