name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Builds the installers and their updater signatures on every platform Riffle
  # ships to. Without tagName / releaseId tauri-action only builds and uploads
  # workflow artifacts; attaching them to a release comes with release-please.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # xdg-utils is needed by the AppImage bundler on top of what ci.yml
      # installs to compile the app.
      - name: Install the Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            xdg-utils

      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.0

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # Keyed by matrix.os rather than runner.os: the two macOS runners differ in
      # architecture and must not share a target directory.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.os }}-

      - name: Install the JS dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/app
          tauriScript: pnpm tauri
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
